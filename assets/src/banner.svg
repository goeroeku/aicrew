      <rect x="750" y="236" width="170" height="42" rx="21" fill="#0284c7"/><text x="835" y="264" text-anchor="middle">orchestrate</text>
      <rect x="932" y="236" width="230" height="42" rx="21" fill="#0ea5e9"/><text x="1047" y="264" text-anchor="middle" fill="#082f49">release candidate</text>
