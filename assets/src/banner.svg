<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="320" viewBox="0 0 1280 320">
  <rect width="1280" height="320" rx="28" fill="#0b1220"/>
  <image xlink:href="../emblem.png" x="52" y="40" width="248" height="240" preserveAspectRatio="xMidYMid meet"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
