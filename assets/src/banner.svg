    <text x="344" y="204" font-size="30" fill="#cbd5e1">A project workflow from idea to release candidate, for Claude Code</text>
    <text x="1232" y="78" font-size="20" fill="#64748b" text-anchor="end">part of</text>
    <text x="1232" y="122" font-size="40" font-weight="800" fill="#e2e8f0" text-anchor="end" letter-spacing="-1"><tspan fill="#38bdf8">AI</tspan>Cosystem</text>
