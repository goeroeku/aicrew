name: release
# Rilis otomatis: saat push ke main menaikkan "version" di .claude-plugin/plugin.json ke nomor yang belum punya tag/rilis,
# dan tes lulus, workflow ini membuat tag vX.Y.Z beserta GitHub Release (aicrew-X.Y.Z.zip, .tar.gz, SHA256SUMS).
# Push biasa tanpa menaikkan versi tidak menghasilkan rilis. workflow_dispatch untuk menjalankan ulang secara manual.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baca versi dan cek apakah sudah dirilis
        id: v
        run: |
          v="$(jq -r .version .claude-plugin/plugin.json)"
          bash scripts/check-version.sh "v$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null || gh release view "v$v" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$v sudah dirilis; tidak ada yang dibuat."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tes plugin
        if: steps.v.outputs.released == 'false'
        run: bash tests/run.sh
      - name: Bangun arsip dan checksum
        if: steps.v.outputs.released == 'false'
        run: bash scripts/build-release.sh "${{ steps.v.outputs.version }}" dist
      - name: Buat tag dan rilis
        if: steps.v.outputs.released == 'false'
        run: |
          v="${{ steps.v.outputs.version }}"
          # catatan rilis dari CHANGELOG.md (sumber yang sama dengan berkasnya) bila bagian versi ada; selain itu catatan otomatis GitHub
          if bash scripts/release-notes.sh --versi "$v" --ekstrak > notes.md 2>/dev/null && [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "v$v" dist/* --target "$GITHUB_SHA" --title "v$v" "${notes[@]}"
